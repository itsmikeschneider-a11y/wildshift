services:
  - type: web
    name: wildshift
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: FAL_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: FAL_MODEL
        value: fal-ai/kling-video/v3/standard/image-to-video
